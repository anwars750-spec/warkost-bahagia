<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lengkapi Akun — Warkost Bahagia</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth customer-auth"><main class="auth-shell auth-modern"><a class="auth-brand-mark" href="/"><img src="/static/assets/warkost-logo.svg" alt="Warkost Bahagia"></a><section class="card auth-card"><span class="section-kicker">SATU LANGKAH LAGI</span><h1>Lengkapi <em>profilmu.</em></h1><p class="auth-lead">Google sudah mengenali <strong>{{google.name}}</strong>. Tambahkan tanggal lahir dan nomor HP untuk akun dan program promosi.</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label>Email Google<input value="{{google.email}}" disabled></label><div class="auth-two-col"><label>Tanggal lahir<input name="birth_date" type="date" autocomplete="bday" required></label><label>No. HP<input name="phone" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel" required></label></div><button class="primary auth-submit" type="submit">Simpan & lanjut <span>→</span></button></form><a class="back-link" href="/login">← Kembali ke login</a></section><small class="auth-footer">Warkost Bahagia · Customer App</small></main></body></html>
