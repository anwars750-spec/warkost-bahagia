<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3b1f0c">
  <title>Masuk — Warkost Bahagia</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth customer-auth">
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="/static/assets/warkost-logo.webp" alt="Warkost Bahagia" class="auth-logo-image">
      <span>Warkost Bahagia</span>
    </div>
    <div class="card auth-card">
      <span class="section-kicker">SELAMAT DATANG KEMBALI</span>
      <h1>Siap pesan<br><em>yang enak?</em></h1>
      <p class="auth-lead">Masuk untuk mulai memilih menu dan membuat pesanan.</p>
      {% if error %}<div class="error">{{error}}</div>{% endif %}
      <form method="post">
        <label> Email atau No. HP
          <input name="identity" placeholder="contoh: customer@local" autocomplete="username" required>
        </label>
        <label> Password
          <input name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </label>
        <button class="primary auth-submit" type="submit">Masuk ke Warkost <span>→</span></button>
      </form>
      <div class="demo-box">
        <strong>Akun demo Customer</strong>
        <span>customer@local</span>
        <small>Password: <b>123456</b></small>
      </div>
      <a class="back-link" href="/">← Kembali ke menu</a>
    </div>
    <small class="auth-footer">Warkost Bahagia · Customer App</small>
  </div>
</body>
</html>
