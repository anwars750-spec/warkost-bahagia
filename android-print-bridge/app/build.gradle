plugins { id 'com.android.application' }
android {
    namespace 'com.warkost.printbridge'
    compileSdk 35
    defaultConfig { applicationId 'com.warkost.printbridge'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0-uat' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = false }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
