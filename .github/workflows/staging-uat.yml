name: Staging UAT

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-ci-password
          MYSQL_DATABASE: warkost_recovery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://root:mysql-ci-password@127.0.0.1:3306/warkost_staging
      SESSION_SECRET: staging-ci-session-secret-2026-minimum-32-characters
      SEED_DEMO_PASSWORD: staging-uat-password-2026
      UPLOAD_DIRECTORY: ${{ github.workspace }}/.uat/uploads
      BACKUP_DIRECTORY: ${{ github.workspace }}/.uat/backups

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify backup and restore rollback
        timeout-minutes: 7
        run: timeout --foreground 5m npm run test:mysql
        env:
          MYSQL_TEST_DATABASE_URL: mysql://root:mysql-ci-password@127.0.0.1:3306/warkost_recovery

      - name: Prepare staging database and storage
        run: |
          mysql -h 127.0.0.1 -uroot -pmysql-ci-password \
            -e "CREATE DATABASE warkost_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mkdir -p "$UPLOAD_DIRECTORY" "$BACKUP_DIRECTORY"
          node scripts/migrate-mysql.mjs
          npm run verify:mysql
          node scripts/seed.mjs

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: ""
          DATABASE_PATH: ${{ runner.temp }}/warkost-unit.db

      - name: Production build and preflight
        run: |
          npm run build
          npm run preflight

      - name: Start production staging server
        run: |
          nohup npm start -- --hostname 127.0.0.1 >/tmp/warkost-staging.log 2>&1 &
          echo $! >/tmp/warkost-staging.pid

      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            "$BASE_URL/api/health/live"
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            "$BASE_URL/api/health/ready"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cross-role browser UAT desktop and mobile
        run: npm run test:uat

      - name: Cross-role HTTP UAT
        run: node scripts/http-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-uat-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop staging server and show logs
        if: always()
        run: |
          if [ -f /tmp/warkost-staging.pid ]; then
            kill "$(cat /tmp/warkost-staging.pid)" 2>/dev/null || true
          fi
          cat /tmp/warkost-staging.log 2>/dev/null || true
