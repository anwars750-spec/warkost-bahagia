name: MySQL Recovery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/mysql-recovery.yml"
      - "app/**"
      - "lib/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: mysql-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-ci-password
          MYSQL_DATABASE: warkost_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify MySQL client tools
        run: |
          mysql --version
          mysqldump --version

      - name: Run MySQL migration and recovery drill
        run: npm run test:mysql
        env:
          MYSQL_TEST_DATABASE_URL: mysql://root:mysql-ci-password@127.0.0.1:3306/warkost_source
