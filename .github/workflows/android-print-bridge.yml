name: Android Print Bridge
on:
  pull_request:
    paths: ['android-print-bridge/**', 'lib/**', 'app/**', 'tests/**', 'scripts/verify-print-bridge-mysql.mjs', '.github/workflows/android-print-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-print-ci-only
          MYSQL_DATABASE: warkost_print_bridge_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql-print-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: ''
          GEOLOCATION_EXTERNAL_ENABLED: 'false'
          GEOLOCATION_TRUST_PROXY: 'false'
      - name: Verify real MySQL JSON and station transactions (disposable only)
        run: node scripts/verify-print-bridge-mysql.mjs
        env:
          CI: 'true'
          PRINT_BRIDGE_MYSQL_URL: mysql://root:mysql-print-ci-only@127.0.0.1:3306/warkost_print_bridge_ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.9'
      - name: Build Android UAT APK and test real sender against fake printers
        working-directory: android-print-bridge
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-print-bridge-uat
          path: |
            android-print-bridge/app/build/outputs/apk/debug/*.apk
            android-print-bridge/app/build/test-results/testDebugUnitTest/*.xml
            android-print-bridge/app/build/reports/lint-results-debug.html
          retention-days: 7
